name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: this workflow only reads the repo to lint/typecheck/test.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, check, unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # The project standardises on Bun (see package.json scripts) and Vercel
      # deploys with Bun. npm install fails here on the svelte-chessground peer
      # dependency (it wants svelte@3 while the app is on svelte@4); Bun resolves
      # it the same way the deploy does.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Sync SvelteKit
        run: bunx svelte-kit sync

      # eslint + svelte-check are run directly rather than the `lint` npm script,
      # because that script also runs `prettier --check .`, which can fail on
      # pre-existing formatting unrelated to these changes.
      - name: Lint
        run: bunx eslint .

      - name: Type-check (svelte-check)
        run: bunx svelte-check --tsconfig ./tsconfig.json

      - name: Unit tests
        run: bunx vitest run

  api:
    name: API (type-check, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The frontend reads these at BUILD time (vite bakes import.meta.env.*). The
    # local-dev .env is gitignored, so set them here so the previewed build can
    # reach the API server the Playwright webServer starts on :3000. Without
    # these the multiplayer spec's WS URL would be undefined.
    env:
      VITE_API_URL: http://localhost:3000
      VITE_API_WS_URL: ws://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Node is needed by the Playwright webServer commands (`npm run build`,
      # `npm run preview`, `npx tsc`, `node api/dist/index.js`). Bun installs
      # deps (it resolves the svelte-chessground peer dep the way the deploy
      # does); Node runs the previewed app and the API server.
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: bun install

      - name: Install API dependencies
        run: bun install
        working-directory: api

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bunx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
