# Fly.io config for the Stalemates stateful WebSocket backend.
#
# This service keeps game rooms in an in-memory Map in a single long-lived
# process, so it MUST run as exactly one always-on instance. Do not scale
# horizontally and do not let Fly stop the machine, or active games are lost.

app = "stalemates-api"
primary_region = "fra"
# On deploy/stop Fly sends kill_signal (default SIGINT; index.ts handles SIGINT and
# SIGTERM) and force-kills after kill_timeout seconds. The server closes sockets with
# 1001 and force-exits after SHUTDOWN_FORCE_EXIT_MS (5 s, src/lib/shutdown.ts), which
# must stay below this so its own cleanup always finishes first (shutdown.test.ts).
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # Fly's edge proxy is one hop in front of the app (client IP from X-Forwarded-For).
  TRUST_PROXY = "1"
  # ORIGIN (deployed frontend origin) is set as a secret/runtime env, not here:
  #   fly secrets set ORIGIN=https://stalemates.magedfaiz.xyz
  # Optional, to let this project's Vercel previews play multiplayer (see README). Only a
  # soft guard: any Vercel account can name a project so <name>.vercel.app matches it.
  # Recommended: leave VITE_API_URL unset for Vercel Preview instead (previews AI-only).
  #   fly secrets set ORIGIN_PATTERNS='https://stale-mates-*-maiz27s-projects.vercel.app'

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the single in-memory instance alive: never auto-stop, always 1 running.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# Restart the single machine whatever the exit code: the server exits non-zero on an
# uncaught exception (index.ts) and 0 after a signal, and either way it must come back.
[[restart]]
  policy = "always"

# Single always-on machine sized for a lightweight Node WS process.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
